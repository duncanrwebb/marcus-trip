<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Expedition Log</title>
<meta http-equiv="refresh" content="0; url=https://duncanrwebb.github.io/expedition-tracker/">
<style>
  :root { --bg:#f5f1e8; --text:#1d2b22; --accent:#24432f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a16; --text:#e6ebe7; --accent:#8fc39f; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  a { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<p>Opening the Expedition Log… <a href="https://duncanrwebb.github.io/expedition-tracker/">tap here</a> if it doesn't.</p>
<script>
  // The app that lived here is now the one at /expedition-tracker/ (same site,
  // so messages saved on this phone carry across). This page's sw.js removes
  // the old app's saved copy.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.update().catch(() => {}))).catch(() => {});
  location.replace("https://duncanrwebb.github.io/expedition-tracker/");
</script>
</body>
</html>
